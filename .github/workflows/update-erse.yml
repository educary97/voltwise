name: Update ERSE Offers & Partnerships

on:
  schedule:
    # Run daily at 2 AM UTC (3 AM Portugal time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Update ERSE offers & partnerships
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npx ts-node lib/scripts/updateOffersAndPartnerships.ts

      - name: Notify on success
        if: success()
        run: echo "✓ ERSE data updated successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "✗ ERSE update failed"
          exit 1
